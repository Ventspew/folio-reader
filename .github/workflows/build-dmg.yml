name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme Folio \
            -configuration Release \
            -derivedDataPath DerivedData \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Stage app
        run: |
          set -euo pipefail
          mkdir -p dist/Folio
          APP=$(find DerivedData/Build/Products/Release -name 'Folio.app' -maxdepth 2 | head -n1)
          echo "Using $APP"
          ditto "$APP" dist/Folio/Folio.app
          # Ad-hoc sign for local Gatekeeper friendliness on CI artifacts
          codesign --force --deep --sign - dist/Folio/Folio.app || true

      - name: Create DMG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            VERSION="main-${GITHUB_SHA::7}"
          fi
          DMG_PATH="dist/Folio-${VERSION}.dmg"
          hdiutil create \
            -volname "Folio" \
            -srcfolder dist/Folio \
            -ov -format UDZO \
            "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          ls -lh dist/

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folio-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
